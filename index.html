<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   SIMPLEX 2D NOISE (inline, no deps)
   ================================================================ */
function createNoise(){
  const p=new Uint8Array(512);
  const perm=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
  for(let i=0;i<256;i++){p[i]=perm[i];p[i+256]=perm[i]}
  const F2=0.5*(Math.sqrt(3)-1),G2=(3-Math.sqrt(3))/6;
  const grad=[{x:1,y:1},{x:-1,y:1},{x:1,y:-1},{x:-1,y:-1},{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  return function(x,y){
    const s=(x+y)*F2;const i=Math.floor(x+s),j=Math.floor(y+s);
    const t=(i+j)*G2;const x0=x-(i-t),y0=y-(j-t);
    let i1,j1;if(x0>y0){i1=1;j1=0}else{i1=0;j1=1}
    const x1=x0-i1+G2,y1=y0-j1+G2,x2=x0-1+2*G2,y2=y0-1+2*G2;
    const ii=i&255,jj=j&255;
    let n0=0,n1=0,n2=0;
    let t0=0.5-x0*x0-y0*y0;if(t0>0){t0*=t0;const g=grad[p[ii+p[jj]]%8];n0=t0*t0*(g.x*x0+g.y*y0)}
    let t1=0.5-x1*x1-y1*y1;if(t1>0){t1*=t1;const g=grad[p[ii+i1+p[jj+j1]]%8];n1=t1*t1*(g.x*x1+g.y*y1)}
    let t2=0.5-x2*x2-y2*y2;if(t2>0){t2*=t2;const g=grad[p[ii+1+p[jj+1]]%8];n2=t2*t2*(g.x*x2+g.y*y2)}
    return 70*(n0+n1+n2);
  };
}
const noise2D=createNoise();

function getTerrainHeight(x,z){
  const cityR=55;
  let h=noise2D(x*0.012,z*0.012)*12+noise2D(x*0.03,z*0.03)*4+noise2D(x*0.06,z*0.06)*1.5;
  const d=Math.sqrt(x*x+z*z);
  if(d<cityR){const t=Math.max(0,Math.min(1,(d-cityR*0.3)/(cityR-cityR*0.3)));h*=t*t*(3-2*t);}
  return h;
}

/* ================================================================
   RENDERER / SCENE / CAMERA
   ================================================================ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.5,500);
camera.position.set(70,65,70);
camera.lookAt(0,0,0);

const orbitControls=new OrbitControls(camera,renderer.domElement);

orbitControls.maxPolarAngle=Math.PI/2.2;

orbitControls.maxDistance=180;
orbitControls.enableDamping=true;

orbitControls.update();

sunLight.shadow.camera.left=-80;sunLight.shadow.camera.right=80;
sunLight.shadow.camera.top=80;sunLight.shadow.camera.bottom=-80;
sunLight.shadow.camera.near=1;sunLight.shadow.camera.far=200;
sunLight.shadow.bias=-0.001;
scene.add(sunLight);

const fillLight=new THREE.DirectionalLight(0xaabbee,0.4);
fillLight.position.set(-40,30,-30);
scene.add(fillLight);

scene.fog=new THREE.FogExp2(0xc8ddf0,0.0025);

/* Moon (for night) */
const moonGeo=new THREE.SphereGeometry(3,16,16);
const moonMat=new THREE.MeshBasicMaterial({color:0xffffee});
const moon=new THREE.Mesh(moonGeo,moonMat);
moon.position.set(-60,90,30);
moon.visible=false;
scene.add(moon);

/* ================================================================
   SKY DOME
   ================================================================ */
const skyGeo=new THREE.SphereGeometry(240,32,32);
const skyPosAttr=skyGeo.attributes.position;
const skyColors=[];
for(let i=0;i<skyPosAttr.count;i++){
  const y=skyPosAttr.getY(i)/240;
  const t=Math.max(0,y);
  skyColors.push(0.78-t*0.3, 0.87-t*0.2, 0.94+t*0.06);
}
skyGeo.setAttribute('color',new THREE.Float32BufferAttribute(skyColors,3));
const skyMat=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false});
const sky=new THREE.Mesh(skyGeo,skyMat);
scene.add(sky);

/* store original sky colors for day/night lerp */
const daySkyColors=new Float32Array(skyColors);
const nightSkyColors=new Float32Array(skyColors.length);
for(let i=0;i<skyPosAttr.count;i++){
  const y=skyPosAttr.getY(i)/240;
  const t=Math.max(0,y);
  nightSkyColors[i*3]=0.02+t*0.03;
  nightSkyColors[i*3+1]=0.02+t*0.04;
  nightSkyColors[i*3+2]=0.06+t*0.08;
}

/* ================================================================
   TERRAIN
   ================================================================ */
const terrainSize=200,terrainSeg=128;
const terrainGeo=new THREE.PlaneGeometry(terrainSize,terrainSize,terrainSeg,terrainSeg);
terrainGeo.rotateX(-Math.PI/2);
const tPos=terrainGeo.attributes.position;
for(let i=0;i<tPos.count;i++){
  tPos.setY(i, getTerrainHeight(tPos.getX(i), tPos.getZ(i)));
}
terrainGeo.computeVertexNormals();
const tColors=[];
for(let i=0;i<tPos.count;i++){
  const x=tPos.getX(i),z=tPos.getZ(i),y=tPos.getY(i);
  const d=Math.sqrt(x*x+z*z);
  if(d<50&&y<2){
    const v=0.4+noise2D(x*0.1,z*0.1)*0.05;
    tColors.push(v,v-0.02,v-0.04);
  } else {
    const v=0.4+noise2D(x*0.05,z*0.05)*0.12;
    tColors.push(0.22+v*0.12, 0.55+v*0.35, 0.08+v*0.08);
  }
}
terrainGeo.setAttribute('color',new THREE.Float32BufferAttribute(tColors,3));
const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9}));
terrain.receiveShadow=true;
scene.add(terrain);

/* ================================================================

const M={

/* ================================================================

// Window grid on a facade
function addWindows(parent,w,h,d,rows,cols,side,color=0x334455){
  const ww=w*0.55/cols,wh=h*0.5/rows;
  const geo=new THREE.PlaneGeometry(ww,wh);
  const mat=new THREE.MeshStandardMaterial({color,roughness:0.15,metalness:0.5});
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const m=new THREE.Mesh(geo,mat);
      const xo=(c-(cols-1)/2)*(w*0.7/cols);
      const yo=(r-(rows-1)/2)*(h*0.6/rows)+h*0.05;
      if(side==='f'){m.position.set(xo,yo,d/2+0.02);}
      else if(side==='b'){m.position.set(xo,yo,-d/2-0.02);m.rotation.y=Math.PI;}
      else if(side==='l'){m.position.set(-w/2-0.02,yo,(c-(cols-1)/2)*(d*0.7/cols));m.rotation.y=-Math.PI/2;}
      else{m.position.set(w/2+0.02,yo,(c-(cols-1)/2)*(d*0.7/cols));m.rotation.y=Math.PI/2;}
      parent.add(m);
    }
  }
}

// Solar panel arrays — visually dominant feature
function addSolarPanels(parent,w,d,y,cols,rowCount){
  const nc=cols||3, nr=rowCount||2;
  const pw=w*0.65/nc, pd=d*0.22;
  const panelGeo=new THREE.BoxGeometry(pw-0.1,0.06,pd);
  const frameGeo=new THREE.BoxGeometry(pw,0.03,pd+0.08);
  for(let r=0;r<nr;r++){
    for(let c=0;c<nc;c++){
      const px=(c-(nc-1)/2)*(pw+0.06);
      const pz=(r-(nr-1)/2)*(pd+0.3);
      const frame=new THREE.Mesh(frameGeo,M.solarFrame);
      frame.position.set(px,y+0.03,pz);
      parent.add(frame);
      const panel=new THREE.Mesh(panelGeo,M.solar);
      panel.position.set(px,y+0.07,pz);
      panel.rotation.x=-0.15;
      parent.add(panel);
    }
  }
}

// AC units
function addACUnits(parent,w,d,y,count){
  const geo=new THREE.BoxGeometry(0.5,0.35,0.5);
  const n=count||2;
  for(let i=0;i<n;i++){
    const ac=new THREE.Mesh(geo,M.acUnit);
    ac.position.set((i-n/2+0.5)*1.2, y+0.18, d*0.2*(i%2===0?1:-1));
    parent.add(ac);
  }
}

// Colored accent band around building
function addAccentBand(parent,w,h,d,color,bandY){
  const mat=new THREE.MeshStandardMaterial({color,roughness:0.4});
  const bandH=0.35;
  const y=bandY!==undefined?bandY:h/2-bandH;
  // Front + back
  const fg=new THREE.PlaneGeometry(w+0.04,bandH);
  const f=new THREE.Mesh(fg,mat);f.position.set(0,y,d/2+0.03);parent.add(f);
  const b=new THREE.Mesh(fg,mat);b.position.set(0,y,-d/2-0.03);b.rotation.y=Math.PI;parent.add(b);
  // Left + right
  const sg=new THREE.PlaneGeometry(d+0.04,bandH);
  const l=new THREE.Mesh(sg,mat);l.position.set(-w/2-0.03,y,0);l.rotation.y=-Math.PI/2;parent.add(l);
  const r=new THREE.Mesh(sg,mat);r.position.set(w/2+0.03,y,0);r.rotation.y=Math.PI/2;parent.add(r);
}

// 3D extruded text sign (simplified block letters)
function make3DSign(text, color, letterW, letterH, depth){
  const mat=new THREE.MeshStandardMaterial({color,roughness:0.4});
  const group=new THREE.Group();
  const lw=letterW||0.8, lh=letterH||1.2, ld=depth||0.3;
  const spacing=lw*1.1;
  const startX=-(text.length-1)*spacing/2;
  for(let i=0;i<text.length;i++){
    const ch=text[i].toUpperCase();
    let geo;
    if(ch===' ') continue;
    // Simple block letter approximation
    geo=new THREE.BoxGeometry(lw*0.8,lh,ld);
    const m=new THREE.Mesh(geo,mat);
    m.position.set(startX+i*spacing,0,0);
    m.castShadow=true;
    group.add(m);
  }
  return group;
}

// Colored letter sign (each letter different color like Google)
function makeColoredLetterSign(letters, colors, lw, lh, ld){
  const group=new THREE.Group();
  const spacing=lw*1.15;
  const startX=-(letters.length-1)*spacing/2;
  for(let i=0;i<letters.length;i++){
    const mat=new THREE.MeshStandardMaterial({color:colors[i%colors.length],roughness:0.35});
    const geo=new THREE.BoxGeometry(lw*0.8,lh,ld);
    const m=new THREE.Mesh(geo,mat);
    m.position.set(startX+i*spacing,0,0);
    m.castShadow=true;
    group.add(m);
  }
  return group;
}

/* ================================================================

   ================================================================ */
function buildCity(){
  // Dense grid positions — buildings packed tight, roads between
  // Approximate positions in a -38..38 range
  const positions=[
    {x:-30,z:-30}, // Apple
    {x:-15,z:-30}, // Google
    {x:  2,z:-30}, // Meta
    {x: 18,z:-30}, // Amazon
    {x: 33,z:-30}, // Tesla
    {x:-32,z:-14}, // Netflix
    {x:-18,z:-14}, // Twitter
    {x: -4,z:-14}, // Uber
    {x: 10,z:-14}, // Airbnb
    {x: 24,z:-12}, // Salesforce
    {x: 36,z:-14}, // Oracle
    {x:-30,z:  2}, // Adobe
    {x:-16,z:  2}, // PayPal
    {x: -2,z:  2}, // LinkedIn
    {x: 12,z:  2}, // Snapchat
    {x: 26,z:  2}, // Spotify
    {x:-28,z: 16}, // Slack
    {x:-14,z: 16}, // Dropbox
    {x:  0,z: 16}, // Pinterest
    {x: 14,z: 18}, // Palantir
    {x: 28,z: 16}, // SpaceX
    {x: 36,z:  4}, // Stripe
  ];

  for(let i=0;i<companyData.length;i++){
    const cd=companyData[i];
    const pos=positions[i];
    const g=new THREE.Group();
    g.position.set(pos.x,0,pos.z);
    g.userData={company:cd.name,color:cd.color,desc:cd.desc,fun:cd.fun};

    switch(i){
      case 0: buildApple(g,cd); break;
      case 1: buildGoogle(g,cd); break;
      case 2: buildMeta(g,cd); break;
      case 3: buildAmazon(g,cd); break;
      case 4: buildTesla(g,cd); break;
      case 5: buildNetflix(g,cd); break;
      case 6: buildTwitter(g,cd); break;
      case 7: buildUber(g,cd); break;
      case 8: buildAirbnb(g,cd); break;
      case 9: buildSalesforce(g,cd); break;
      case 10: buildOracle(g,cd); break;
      case 11: buildAdobe(g,cd); break;
      case 12: buildPayPal(g,cd); break;
      case 13: buildLinkedIn(g,cd); break;
      case 14: buildSnapchat(g,cd); break;
      case 15: buildSpotify(g,cd); break;
      case 16: buildSlack(g,cd); break;
      case 17: buildDropbox(g,cd); break;
      case 18: buildPinterest(g,cd); break;
      case 19: buildPalantir(g,cd); break;
      case 20: buildSpaceX(g,cd); break;
      case 21: buildStripe(g,cd); break;
    }

    scene.add(g);
    buildingGroups.push(g);
    companies.push(cd);
  }
}

/* ---- APPLE: Torus ring campus ---- */
function buildApple(g,cd){
  const mat=new THREE.MeshStandardMaterial({color:0xdddddd,roughness:0.3,metalness:0.4});
  const ring=new THREE.Mesh(new THREE.TorusGeometry(4.5,1.2,12,32),mat);
  ring.position.set(0,1.5,0);ring.rotation.x=-Math.PI/2;ring.castShadow=true;ring.receiveShadow=true;
  g.add(ring);
  // Glass curtain wall
  const glassMat=new THREE.MeshStandardMaterial({color:0x88bbdd,roughness:0.1,metalness:0.5,transparent:true,opacity:0.4});
  const glassRing=new THREE.Mesh(new THREE.TorusGeometry(4.5,0.15,8,32),glassMat);
  glassRing.position.set(0,2.5,0);glassRing.rotation.x=-Math.PI/2;g.add(glassRing);
  // Courtyard trees
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    const tree=makeSmallTree(0x2d8a4e);
    tree.position.set(Math.cos(a)*2.2,0.2,Math.sin(a)*2.2);
    tree.scale.set(0.5,0.5,0.5);
    g.add(tree);
  }
  // Solar panels on ring
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const sp=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.06,0.6),M.solar);
    sp.position.set(Math.cos(a)*4.5,2.8,Math.sin(a)*4.5);
    sp.rotation.y=a;sp.rotation.x=-0.15;
    g.add(sp);
  }
  // Sign
  const sign=make3DSign('APPLE',cd.color,0.6,0.8,0.2);
  sign.position.set(0,0.5,6.5);g.add(sign);
  addACUnits(g,2,2,2.7,3);
}

/* ---- GOOGLE: 4-building campus + colored letters + Android ---- */
function buildGoogle(g,cd){
  const bMat=new THREE.MeshStandardMaterial({color:0xe8e8e8,roughness:0.5});
  // 4 buildings in L-shape
  const bw=4,bh=4,bd=5;
  const offsets=[{x:-3,z:-2},{x:3,z:-2},{x:-3,z:3},{x:3,z:3}];
  for(const o of offsets){
    const box=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),bMat);
    box.position.set(o.x,bh/2,o.z);box.castShadow=true;box.receiveShadow=true;
    g.add(box);
    addWindows(g,bw,bh,bd,3,4,'f');
    // Move windows to correct position - add to box instead
    addSolarPanels(g,bw*0.8,bd*0.8,bh+0.01,2,1);
    // Shift solar panels
    const lastChildren=g.children.slice(-4);
    for(const c of lastChildren) c.position.x+=o.x, c.position.z+=o.z;
    const winChildren=g.children.slice(-4-12,-4);
    for(const c of winChildren) c.position.x+=o.x, c.position.z+=o.z;
  }
  // Accent bands
  for(const o of offsets){
    const bandMat=new THREE.MeshStandardMaterial({color:cd.color,roughness:0.4});
    const band=new THREE.Mesh(new THREE.BoxGeometry(bw+0.1,0.3,bd+0.1),bandMat);
    band.position.set(o.x,bh-0.15,o.z);g.add(band);
  }
  // 3D "GOOGLE" colored letters
  const gLetters='GOOGLE';
  const gColors=[0x4285F4,0xEA4335,0xFBBC05,0x4285F4,0x34A853,0xEA4335];
  const sign=makeColoredLetterSign(gLetters,gColors,0.9,1.4,0.35);
  sign.position.set(0,0.8,8);g.add(sign);
  // Android robot statue
  const androidMat=new THREE.MeshStandardMaterial({color:0x3DDC84,roughness:0.4});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.8,12),androidMat);
  body.position.set(5,0.6,7);g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.5,12,8,0,Math.PI*2,0,Math.PI/2),androidMat);
  head.position.set(5,1.0,7);g.add(head);
  // Antennae
  for(const dx of[-0.2,0.2]){
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.35,4),androidMat);
    ant.position.set(5+dx,1.5,7);ant.rotation.z=dx>0?0.3:-0.3;g.add(ant);
  }
}

/* ================================================================
   ROADS — grid + diagonals + ring road
   ================================================================ */
function buildRoads(){
  const roadGroup=new THREE.Group();
  const roadMat=new THREE.MeshStandardMaterial({color:0x333333,roughness:0.9});
  const lineMat=new THREE.MeshStandardMaterial({color:0xdddd44,roughness:0.5});

  // Horizontal grid roads
  for(const z of[-22,-7,9,24]){
    const road=new THREE.Mesh(new THREE.BoxGeometry(90,0.05,3),roadMat);
    road.position.set(0,0.02,z);road.receiveShadow=true;roadGroup.add(road);
    // Center line
    for(let x=-42;x<42;x+=2.5){
      const line=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.06,0.1),lineMat);
      line.position.set(x,0.06,z);roadGroup.add(line);
    }
  }
  // Vertical grid roads
  for(const x of[-24,-9,6,20,35]){
    const road=new THREE.Mesh(new THREE.BoxGeometry(3,0.05,65),roadMat);
    road.position.set(x,0.02,0);road.receiveShadow=true;roadGroup.add(road);
    for(let z=-30;z<30;z+=2.5){
      const line=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.06,1.5),lineMat);
      line.position.set(x,0.06,z);roadGroup.add(line);
    }
  }
  // Diagonal road
  const diagLen=50;
  const diag=new THREE.Mesh(new THREE.BoxGeometry(diagLen,0.05,2.5),roadMat);
  diag.position.set(5,0.03,0);diag.rotation.y=Math.PI/6;diag.receiveShadow=true;roadGroup.add(diag);

  // Ring road (approximate with segments)
  const ringR=42, ringSegs=24;
  for(let i=0;i<ringSegs;i++){
    const a1=i/ringSegs*Math.PI*2;
    const a2=(i+1)/ringSegs*Math.PI*2;
    const cx=(Math.cos(a1)+Math.cos(a2))/2*ringR;
    const cz=(Math.sin(a1)+Math.sin(a2))/2*ringR;
    const segLen=2*ringR*Math.sin(Math.PI/ringSegs);
    const seg=new THREE.Mesh(new THREE.BoxGeometry(segLen+0.3,0.05,2.5),roadMat);
    seg.position.set(cx,0.03,cz);
    seg.rotation.y=-(a1+a2)/2+Math.PI/2;
    seg.receiveShadow=true;
    roadGroup.add(seg);
  }

  scene.add(roadGroup);

  // Highway overpass
  const overpassGroup=new THREE.Group();
  const overMat=new THREE.MeshStandardMaterial({color:0x555555,roughness:0.7});
  // Deck
  const deck=new THREE.Mesh(new THREE.BoxGeometry(50,0.3,4),overMat);
  deck.position.set(0,3.5,32);deck.castShadow=true;deck.receiveShadow=true;overpassGroup.add(deck);
  // Pillars
  for(let x=-22;x<=22;x+=8){
    const pillar=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.35,3.5,6),M.concrete);
    pillar.position.set(x,1.75,32);pillar.castShadow=true;overpassGroup.add(pillar);
  }
  // Guard rails
  for(const dz of[-2,2]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(50,0.5,0.08),M.metal);
    rail.position.set(0,3.9,32+dz);overpassGroup.add(rail);
  }
  // Ramps
  for(const side of[-1,1]){
    const ramp=new THREE.Mesh(new THREE.BoxGeometry(8,0.3,4),overMat);
    ramp.position.set(side*27,2,32);ramp.rotation.z=side*0.2;ramp.receiveShadow=true;overpassGroup.add(ramp);
  }
  scene.add(overpassGroup);
}

function buildPowerLines(){

  const wireMat=new THREE.MeshStandardMaterial({color:0x333333,roughness:0.3});
  const positions=[
    {x:-42,z:35},{x:-30,z:35},{x:-18,z:35},{x:-6,z:35},{x:6,z:35},{x:18,z:35}

    const arm=new THREE.Mesh(new THREE.BoxGeometry(2,0.08,0.08),poleMat);

  const attempt=()=>{
    if(Math.random()<0.4){
      // Outer ring
      const a=Math.random()*Math.PI*2;
      const r=45+Math.random()*40;
      return [Math.cos(a)*r,Math.sin(a)*r];
    } else {
      // In city area — along roads / park strips
      return [(Math.random()-0.5)*80,(Math.random()-0.5)*70];
    }
  };
  [x,z]=attempt();
  const y=getTerrainHeight(x,z);
  const s=0.6+Math.random()*0.8;

  tmpMat4.compose(
    tmpPos.set(x,y+0.4*s,z),

  );

const roadYPositions=[-22,-7,9,24];

  const color=new THREE.Color(carColors[i%carColors.length]);

    z=(Math.random()-0.5)*60;
    dir=Math.random()>0.5?1:-1;

  carStates.push({x,z,dir,speed:1.5+Math.random()*2.5,isHorizontal});

function updateCars(dt){
  for(let i=0;i<carCount;i++){
    const cs=carStates[i];
    if(cs.isHorizontal){
      cs.x+=cs.dir*cs.speed*dt;
      if(cs.x>45) cs.x=-45;
      if(cs.x<-45) cs.x=45;
    } else {
      cs.z+=cs.dir*cs.speed*dt;
      if(cs.z>35) cs.z=-35;
      if(cs.z<-35) cs.z=35;
    }
    const rotY=cs.isHorizontal?(cs.dir>0?Math.PI/2:-Math.PI/2):(cs.dir>0?0:Math.PI);
    tmpMat4.compose(
      tmpPos.set(cs.x,0.2,cs.z),
      tmpQuat.setFromEuler(new THREE.Euler(0,rotY,0)),
      tmpScale.set(1,1,1)
    );
    carInstanced.setMatrixAt(i,tmpMat4);
    tmpMat4.compose(
      tmpPos.set(cs.x,0.42,cs.z),
      tmpQuat.setFromEuler(new THREE.Euler(0,rotY,0)),
      tmpScale.set(1,1,1)
    );
    carRoofInstanced.setMatrixAt(i,tmpMat4);
  }
  carInstanced.instanceMatrix.needsUpdate=true;
  carRoofInstanced.instanceMatrix.needsUpdate=true;
}

/* ================================================================
   POST-PROCESSING: Tilt-Shift + Color Grade
   ================================================================ */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

// Tilt-shift shader
const TiltShiftShader={
  uniforms:{
    tDiffuse:{value:null},
    focusY:{value:0.5},
    blurAmount:{value:0.005},
    aspect:{value:window.innerWidth/window.innerHeight},
  },
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float focusY;
    uniform float blurAmount;
    uniform float aspect;
    varying vec2 vUv;
    void main(){
      float dist=abs(vUv.y-focusY);
      float blur=smoothstep(0.0,0.4,dist)*blurAmount;
      vec4 c=vec4(0.0);
      float total=0.0;
      for(int i=-4;i<=4;i++){
        for(int j=-4;j<=4;j++){
          float w=1.0-length(vec2(float(i),float(j)))/6.0;
          if(w<0.0) continue;
          vec2 offset=vec2(float(i)*blur/aspect,float(j)*blur);
          c+=texture2D(tDiffuse,vUv+offset)*w;
          total+=w;
        }
      }
      gl_FragColor=c/total;
    }`
};
const tiltShiftPass=new ShaderPass(TiltShiftShader);
composer.addPass(tiltShiftPass);

// Color grade shader (warmth, vignette, saturation)
const ColorGradeShader={
  uniforms:{
    tDiffuse:{value:null},
    warmth:{value:0.08},
    saturation:{value:1.15},
    vignette:{value:0.4},
  },
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float warmth;
    uniform float saturation;
    uniform float vignette;
    varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      // Warmth
      c.r+=warmth;c.b-=warmth*0.5;
      // Saturation
      float grey=dot(c.rgb,vec3(0.299,0.587,0.114));
      c.rgb=mix(vec3(grey),c.rgb,saturation);
      // Vignette
      float d=distance(vUv,vec2(0.5));
      c.rgb*=1.0-d*d*vignette;
      gl_FragColor=c;
    }`
};
const colorGradePass=new ShaderPass(ColorGradeShader);
composer.addPass(colorGradePass);

/* ================================================================
   DAY / NIGHT TOGGLE
   ================================================================ */
let isNight=false;
let dayNightT=0; // 0=day, 1=night
const btnDayNight=document.getElementById('btn-daynight');

btnDayNight.addEventListener('click',()=>{
  isNight=!isNight;
  btnDayNight.textContent=isNight?'Moon':'Sun';
});

function updateDayNight(dt){
  const target=isNight?1:0;
  dayNightT+=(target-dayNightT)*Math.min(1,dt*2);

  // Lights
  sunLight.intensity=THREE.MathUtils.lerp(2.2,0.1,dayNightT);
  ambientLight.intensity=THREE.MathUtils.lerp(0.4,0.15,dayNightT);
  hemiLight.intensity=THREE.MathUtils.lerp(1.2,0.1,dayNightT);
  fillLight.intensity=THREE.MathUtils.lerp(0.4,0.05,dayNightT);

  // Sky colors
  const skyAttr=sky.geometry.attributes.color;
  for(let i=0;i<skyAttr.count;i++){
    skyAttr.setXYZ(i,
      THREE.MathUtils.lerp(daySkyColors[i*3],nightSkyColors[i*3],dayNightT),
      THREE.MathUtils.lerp(daySkyColors[i*3+1],nightSkyColors[i*3+1],dayNightT),
      THREE.MathUtils.lerp(daySkyColors[i*3+2],nightSkyColors[i*3+2],dayNightT)
    );
  }
  skyAttr.needsUpdate=true;

  // Fog color
  const fogDay=new THREE.Color(0xc8ddf0);
  const fogNight=new THREE.Color(0x0a0a1a);
  scene.fog.color.lerpColors(fogDay,fogNight,dayNightT);

  // Window glow
  M.windowGlow.emissiveIntensity=dayNightT*0.8;

  // Street light glow
  lightBulbMat.emissiveIntensity=dayNightT*1.5;

  // Moon
  moon.visible=dayNightT>0.3;

  // Color grade warmth shifts at night
  colorGradePass.uniforms.warmth.value=THREE.MathUtils.lerp(0.08,-0.02,dayNightT);
  colorGradePass.uniforms.saturation.value=THREE.MathUtils.lerp(1.15,0.85,dayNightT);
}

  viewModeEl.textContent=flyMode?'View: Fly':'View: Orbit';
  if(flyMode){
    flyState.euler.setFromQuaternion(camera.quaternion);
  }
  // Adjust tilt-shift in fly mode
  tiltShiftPass.uniforms.blurAmount.value=flyMode?0.002:0.005;
});

window.addEventListener('keydown',e=>{
  if(!flyMode) return;
  switch(e.code){
    case 'KeyW': flyState.forward=1;break;
    case 'KeyS': flyState.forward=-1;break;
    case 'KeyA': flyState.right=-1;break;
    case 'KeyD': flyState.right=1;break;
    case 'KeyQ': flyState.up=-1;break;
    case 'KeyE': flyState.up=1;break;
  }
});
window.addEventListener('keyup',e=>{
  if(!flyMode) return;
  switch(e.code){
    case 'KeyW':case 'KeyS': flyState.forward=0;break;
    case 'KeyA':case 'KeyD': flyState.right=0;break;
    case 'KeyQ':case 'KeyE': flyState.up=0;break;
  }
});

// Mouse drag for look direction (no pointer lock)
renderer.domElement.addEventListener('mousedown',e=>{
  if(!flyMode) return;
  flyState.mouseDown=true;
  flyState.lastMX=e.clientX;
  flyState.lastMY=e.clientY;
});
window.addEventListener('mouseup',()=>{flyState.mouseDown=false;});
window.addEventListener('mousemove',e=>{
  if(!flyMode||!flyState.mouseDown) return;
  const dx=e.clientX-flyState.lastMX;
  const dy=e.clientY-flyState.lastMY;
  flyState.euler.y-=dx*0.003;
  flyState.euler.x-=dy*0.003;
  flyState.euler.x=Math.max(-Math.PI/2+0.1,Math.min(Math.PI/2-0.1,flyState.euler.x));
  camera.quaternion.setFromEuler(flyState.euler);
  flyState.lastMX=e.clientX;
  flyState.lastMY=e.clientY;
});

// Scroll wheel adjusts speed
renderer.domElement.addEventListener('wheel',e=>{
  if(!flyMode) return;
  e.preventDefault();
  flyState.speed=Math.max(2,Math.min(60,flyState.speed-e.deltaY*0.05));
},{passive:false});

function updateFlyMode(dt){
  if(!flyMode) return;
  const dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  const right=new THREE.Vector3();
  right.crossVectors(dir,camera.up).normalize();

  camera.position.addScaledVector(dir,flyState.forward*flyState.speed*dt);
  camera.position.addScaledVector(right,flyState.right*flyState.speed*dt);
  camera.position.y+=flyState.up*flyState.speed*dt;

  // Floor clamp
  if(camera.position.y<1) camera.position.y=1;
}

/* ================================================================
   RAYCASTER — click for info card
   ================================================================ */
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const infoCard=document.getElementById('info-card');
const infoName=document.getElementById('info-name');
const infoAccent=document.getElementById('info-accent');
const infoDesc=document.getElementById('info-desc');
const infoFun=document.getElementById('info-fun');

renderer.domElement.addEventListener('click',e=>{
  if(flyMode) return;
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);

  // Check building groups
  for(const bg of buildingGroups){
    const hits=raycaster.intersectObjects(bg.children,true);
    if(hits.length>0){
      const cd=bg.userData;
      infoName.textContent=cd.company;
      infoAccent.style.background='#'+new THREE.Color(cd.color).getHexString();
      infoDesc.textContent=cd.desc;
      infoFun.textContent=cd.fun;
      infoCard.style.display='block';
      return;
    }
  }
  infoCard.style.display='none';
});

document.getElementById('info-close').addEventListener('click',()=>{
  infoCard.style.display='none';
});

/* ================================================================
   MINIMAP
   ================================================================ */
const minimapCanvas=document.getElementById('minimap-canvas');
const minimapCtx=minimapCanvas.getContext('2d');

function updateMinimap(){
  const w=minimapCanvas.width, h=minimapCanvas.height;
  minimapCtx.fillStyle='#1a2a1a';
  minimapCtx.fillRect(0,0,w,h);

  // Draw terrain hint
  minimapCtx.fillStyle='#2a4a2a';
  minimapCtx.fillRect(10,10,w-20,h-20);

  // Draw buildings as colored dots
  const scale=w/120;
  const cx=w/2, cy=h/2;
  for(const bg of buildingGroups){
    const bx=cx+bg.position.x*scale;
    const bz=cy+bg.position.z*scale;
    minimapCtx.fillStyle='#'+new THREE.Color(bg.userData.color).getHexString();
    minimapCtx.fillRect(bx-3,bz-3,6,6);
  }

  // Roads
  minimapCtx.strokeStyle='rgba(80,80,80,0.6)';
  minimapCtx.lineWidth=1;
  for(const z of[-22,-7,9,24]){
    minimapCtx.beginPath();
    minimapCtx.moveTo(cx-40*scale,cy+z*scale);
    minimapCtx.lineTo(cx+40*scale,cy+z*scale);
    minimapCtx.stroke();
  }
  for(const x of[-24,-9,6,20,35]){
    minimapCtx.beginPath();
    minimapCtx.moveTo(cx+x*scale,cy-30*scale);
    minimapCtx.lineTo(cx+x*scale,cy+30*scale);
    minimapCtx.stroke();
  }

  // Camera position
  minimapCtx.fillStyle='#ff4444';
  const camX=cx+camera.position.x*scale;
  const camZ=cy+camera.position.z*scale;
  minimapCtx.beginPath();
  minimapCtx.arc(camX,camZ,4,0,Math.PI*2);
  minimapCtx.fill();

  // Camera direction
  const dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  minimapCtx.strokeStyle='#ff4444';
  minimapCtx.lineWidth=2;
  minimapCtx.beginPath();
  minimapCtx.moveTo(camX,camZ);
  minimapCtx.lineTo(camX+dir.x*15,camZ+dir.z*15);
  minimapCtx.stroke();
}

/* ================================================================
   FPS COUNTER
   ================================================================ */
const fpsEl=document.getElementById('fps-counter');
let frameCount=0, fpsTime=0;

/* ================================================================
   LANDING SCREEN
   ================================================================ */
const landing=document.getElementById('landing');
let started=false;

landing.addEventListener('click',()=>{
  landing.classList.add('hidden');
  started=true;
  setTimeout(()=>{landing.style.display='none';},1300);
});

/* ================================================================
   RESIZE
   ================================================================ */
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  composer.setSize(window.innerWidth,window.innerHeight);
  tiltShiftPass.uniforms.aspect.value=window.innerWidth/window.innerHeight;
});

/* ================================================================
   ANIMATION LOOP
   ================================================================ */
const clock=new THREE.Clock();
let minimapTimer=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);

  if(!started) return;

  // Update systems
  updateDayNight(dt);
  updateCars(dt);
  updatePeople(dt);

  if(flyMode){
    updateFlyMode(dt);
  } else {
    orbitControls.update();
  }

  // FPS
  frameCount++;
  fpsTime+=dt;
  if(fpsTime>=0.5){
    fpsEl.textContent='FPS: '+Math.round(frameCount/fpsTime);
    frameCount=0;fpsTime=0;
  }

  // Minimap (throttle to 4 FPS)
  minimapTimer+=dt;
  if(minimapTimer>0.25){
    updateMinimap();
    minimapTimer=0;
  }

  // Render
  composer.render();
}

animate();

</script>
