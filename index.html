<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ================================================================
   SIMPLEX 2D NOISE (inline)
   ================================================================ */
function createNoise(){
  const p=new Uint8Array(512);
  const perm=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
  for(let i=0;i<256;i++){p[i]=perm[i];p[i+256]=perm[i]}
  const F2=0.5*(Math.sqrt(3)-1),G2=(3-Math.sqrt(3))/6;
  const grad=[{x:1,y:1},{x:-1,y:1},{x:1,y:-1},{x:-1,y:-1},{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  return function(x,y){
    const s=(x+y)*F2;const i=Math.floor(x+s),j=Math.floor(y+s);
    const t=(i+j)*G2;const x0=x-(i-t),y0=y-(j-t);
    let i1,j1;if(x0>y0){i1=1;j1=0}else{i1=0;j1=1}
    const x1=x0-i1+G2,y1=y0-j1+G2,x2=x0-1+2*G2,y2=y0-1+2*G2;
    const ii=i&255,jj=j&255;
    let n0=0,n1=0,n2=0;
    let t0=0.5-x0*x0-y0*y0;if(t0>0){t0*=t0;const g=grad[p[ii+p[jj]]%8];n0=t0*t0*(g.x*x0+g.y*y0)}
    let t1=0.5-x1*x1-y1*y1;if(t1>0){t1*=t1;const g=grad[p[ii+i1+p[jj+j1]]%8];n1=t1*t1*(g.x*x1+g.y*y1)}
    let t2=0.5-x2*x2-y2*y2;if(t2>0){t2*=t2;const g=grad[p[ii+1+p[jj+1]]%8];n2=t2*t2*(g.x*x2+g.y*y2)}
    return 70*(n0+n1+n2);
  }
}
const noise2D=createNoise();

function getTerrainHeight(x,z){
  const cityR=55;
  let h=noise2D(x*0.012,z*0.012)*12
      +noise2D(x*0.03,z*0.03)*4
      +noise2D(x*0.06,z*0.06)*1.5;
  const d=Math.sqrt(x*x+z*z);
  if(d<cityR){
    const t=Math.max(0,Math.min(1,(d-cityR*0.3)/(cityR-cityR*0.3)));
    const f=t*t*(3-2*t);          // smoothstep
    h=h*f;
  }
  return h;
}

/* ================================================================
   RENDERER / SCENE / CAMERA
   ================================================================ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.5,500);
camera.position.set(70,65,70);
camera.lookAt(0,0,0);

const orbitControls=new OrbitControls(camera,renderer.domElement);
orbitControls.target.set(0,0,0);
orbitControls.maxPolarAngle=Math.PI/2-0.05;
orbitControls.minDistance=15;
orbitControls.maxDistance=180;
orbitControls.enableDamping=true;
orbitControls.dampingFactor=0.06;
orbitControls.update();

/* ================================================================
   LIGHTING
   ================================================================ */
const ambientLight=new THREE.AmbientLight(0x404060,0.3);
scene.add(ambientLight);
const hemiLight=new THREE.HemisphereLight(0x87CEEB,0xB5935A,1.2);
scene.add(hemiLight);

const sunLight=new THREE.DirectionalLight(0xfff4e0,2.0);
sunLight.position.set(60,80,40);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);
sunLight.shadow.camera.left=-100;sunLight.shadow.camera.right=100;
sunLight.shadow.camera.top=100;sunLight.shadow.camera.bottom=-100;
sunLight.shadow.camera.near=1;sunLight.shadow.camera.far=200;
sunLight.shadow.bias=-0.001;
scene.add(sunLight);

scene.fog=new THREE.FogExp2(0xc8ddf0,0.004);

/* ================================================================
   SKY DOME
   ================================================================ */
const skyGeo=new THREE.SphereGeometry(250,32,32);
const skyPosAttr=skyGeo.attributes.position;
const skyColors=[];
for(let i=0;i<skyPosAttr.count;i++){
  const y=skyPosAttr.getY(i)/250;
  const t=Math.max(0,y);
  skyColors.push(0.78-t*0.3, 0.87-t*0.2, 0.94+t*0.06);
}
skyGeo.setAttribute('color',new THREE.Float32BufferAttribute(skyColors,3));
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false}));
scene.add(sky);

/* ================================================================
   TERRAIN
   ================================================================ */
const terrainSize=200, terrainSeg=128;
const terrainGeo=new THREE.PlaneGeometry(terrainSize,terrainSize,terrainSeg,terrainSeg);
terrainGeo.rotateX(-Math.PI/2);
const tPos=terrainGeo.attributes.position;
for(let i=0;i<tPos.count;i++){
  tPos.setY(i, getTerrainHeight(tPos.getX(i), tPos.getZ(i)));
}
terrainGeo.computeVertexNormals();

const tColors=[];
for(let i=0;i<tPos.count;i++){
  const x=tPos.getX(i), z=tPos.getZ(i), y=tPos.getY(i);
  const d=Math.sqrt(x*x+z*z);
  if(d<50&&y<2){
    tColors.push(0.35,0.42,0.32);
  } else {
    const v=0.4+noise2D(x*0.05,z*0.05)*0.1;
    tColors.push(0.28+v*0.15, 0.65+v*0.3, 0.15+v*0.1);
  }
}
terrainGeo.setAttribute('color',new THREE.Float32BufferAttribute(tColors,3));
const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9}));
terrain.receiveShadow=true;
scene.add(terrain);

/* ================================================================
   SHARED MATERIALS
   ================================================================ */
const M={
  white:  new THREE.MeshStandardMaterial({color:0xf0f0f0,roughness:0.6}),
  window: new THREE.MeshStandardMaterial({color:0x334455,roughness:0.2,metalness:0.5}),
  road:   new THREE.MeshStandardMaterial({color:0x444444,roughness:0.95}),
  glass:  new THREE.MeshStandardMaterial({color:0x88bbdd,roughness:0.1,metalness:0.6,transparent:true,opacity:0.6}),
  concrete:new THREE.MeshStandardMaterial({color:0x999999,roughness:0.8}),
  crane:  new THREE.MeshStandardMaterial({color:0xffaa00,roughness:0.5}),
  metal:  new THREE.MeshStandardMaterial({color:0x888888,roughness:0.3,metalness:0.7}),
};

/* ================================================================
   BUILDING HELPER: WINDOW GRID
   ================================================================ */
function addWindows(parent,w,h,d,rows,cols,side,color=0x334455){
  const ww=w*0.55/cols, wh=h*0.5/rows;
  const geo=new THREE.PlaneGeometry(ww,wh);
  const mat=new THREE.MeshStandardMaterial({color,roughness:0.2,metalness:0.5});
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const m=new THREE.Mesh(geo,mat);
      const xo=(c-(cols-1)/2)*(w*0.7/cols);
      const yo=(r-(rows-1)/2)*(h*0.6/rows)+h*0.05;
      if(side==='f'){m.position.set(xo,yo,d/2+0.02)}
      else if(side==='b'){m.position.set(xo,yo,-d/2-0.02);m.rotation.y=Math.PI}
      else if(side==='l'){m.position.set(-w/2-0.02,yo,(c-(cols-1)/2)*(d*0.7/cols));m.rotation.y=-Math.PI/2}
      else{m.position.set(w/2+0.02,yo,(c-(cols-1)/2)*(d*0.7/cols));m.rotation.y=Math.PI/2}
      parent.add(m);
    }
  }
}

/* ================================================================
   COMPANY DATA
   ================================================================ */
const companies=[
  {name:'Apple',color:0xc0c0c0,x:-25,z:-20,desc:'The Ring - Apple Park',fun:'Cost $5 billion to build, more than the new World Trade Center.',shape:'ring'},
  {name:'Google',color:0x4285F4,x:-15,z:-8,desc:'Googleplex campus - colorful and sprawling',fun:'The first Google storage was made of LEGO bricks.',shape:'campus'},
  {name:'Facebook / Meta',color:0x1877F2,x:8,z:-18,desc:'Menlo Park HQ with rooftop park',fun:'The thumbs-up sign was originally a Sun Microsystems logo.',shape:'flat'},
  {name:'Amazon',color:0xFF9900,x:20,z:-5,desc:'The Spheres - biosphere work spaces',fun:'The Spheres contain over 40,000 plants from 30 countries.',shape:'spheres'},
  {name:'Tesla',color:0xCC0000,x:-30,z:8,desc:'Fremont Factory with smokestacks',fun:'Tesla factory was previously a GM-Toyota joint venture plant.',shape:'factory'},
  {name:'Netflix',color:0xE50914,x:5,z:10,desc:'Los Gatos streaming HQ',fun:'Netflix first DVD mailed was Beetlejuice in 1998.',shape:'modern'},
  {name:'Twitter / X',color:0x1DA1F2,x:-8,z:15,desc:'San Francisco headquarters',fun:'Twitter was almost named "Friendstalker" before launch.',shape:'tower'},
  {name:'Uber',color:0x000000,x:15,z:15,desc:'Mission Bay sleek tower',fun:'The first Uber ride was in Paris, not San Francisco.',shape:'sleek'},
  {name:'Airbnb',color:0xFF5A5F,x:-20,z:-32,desc:'Brannan Street HQ - cozy design',fun:'The founders sold cereal boxes to fund the company.',shape:'cozy'},
  {name:'Salesforce',color:0x00A1E0,x:28,z:-15,desc:'Salesforce Tower - tallest in SF skyline',fun:'At 1,070 feet it is the tallest building in San Francisco.',shape:'tallest'},
  {name:'Oracle',color:0xCC0000,x:35,z:5,desc:'Redwood Shores - cylindrical towers',fun:'Larry Ellison named it after a CIA database project.',shape:'cylinders'},
  {name:'Adobe',color:0xFA0F00,x:-35,z:-10,desc:'San Jose red-accent towers',fun:'Named after Adobe Creek behind the co-founder house.',shape:'twin'},
  {name:'PayPal',color:0x003087,x:18,z:25,desc:'San Jose payments HQ',fun:'PayPal founders are known as the "PayPal Mafia."',shape:'box'},
  {name:'LinkedIn',color:0x0A66C2,x:-12,z:28,desc:'Sunnyvale glass campus',fun:'A new member joins LinkedIn every 2 seconds.',shape:'glass'},
  {name:'Snapchat',color:0xFFFC00,x:30,z:20,desc:'Santa Monica yellow HQ',fun:'Snapchat was originally called "Picaboo."',shape:'box'},
  {name:'Spotify',color:0x1DB954,x:-28,z:22,desc:'Stockholm-inspired green building',fun:'The most-streamed song has over 4 billion plays.',shape:'modern'},
  {name:'Slack',color:0x611f69,x:0,z:-30,desc:'Multi-colored communication HQ',fun:'Slack = Searchable Log of All Conversation and Knowledge.',shape:'box'},
  {name:'Dropbox',color:0x0061FF,x:-38,z:0,desc:'Blue box-shaped headquarters',fun:'Dropbox was born from the founder forgetting his USB drive.',shape:'cube'},
  {name:'Pinterest',color:0xBD081C,x:38,z:-8,desc:'Visual discovery red HQ',fun:'The site was originally called "Tote" - a virtual tote bag.',shape:'box'},
  {name:'Palantir',color:0x101010,x:25,z:-28,desc:'Mysterious data analytics fortress',fun:'Named after the seeing stones in Lord of the Rings.',shape:'dark'},
  {name:'SpaceX',color:0x005288,x:-15,z:-40,desc:'Hawthorne rocket factory',fun:'SpaceX has landed orbital rocket boosters over 300 times.',shape:'spacex'},
  {name:'Stripe',color:0x635BFF,x:12,z:-38,desc:'Clean modern payments infrastructure',fun:'Founded by two Irish brothers from rural Limerick.',shape:'modern'},
];

/* ================================================================
   BUILD EACH COMPANY
   ================================================================ */
const buildingGroup=new THREE.Group();
scene.add(buildingGroup);
const buildingMeshes=[];   // raycaster targets

const windowMats=[];       // track for night-glow

function createBuilding(co){
  const g=new THREE.Group();
  g.userData={company:co.name,desc:co.desc,fun:co.fun,color:co.color};
  const accent=new THREE.MeshStandardMaterial({color:co.color,roughness:0.4});
  let mainH=6;

  function tag(mesh){ buildingMeshes.push(mesh); mesh.userData=g.userData; }

  switch(co.shape){

  /* ---------- Apple Ring ---------- */
  case 'ring':{
    const ring=new THREE.Mesh(new THREE.TorusGeometry(5,1.2,8,32),new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:0.3,metalness:0.2}));
    ring.rotation.x=-Math.PI/2;ring.position.y=1.8;ring.castShadow=true;g.add(ring);tag(ring);
    for(let a=0;a<8;a++){
      const t=a/8*Math.PI*2;
      const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.5,6,6),new THREE.MeshStandardMaterial({color:0x2d8a2d}));
      leaf.position.set(Math.cos(t)*2.5,2.2,Math.sin(t)*2.5);g.add(leaf);
    }
    const band=new THREE.Mesh(new THREE.TorusGeometry(5,0.15,4,32),accent);
    band.rotation.x=-Math.PI/2;band.position.y=3.1;g.add(band);
    mainH=3;break;
  }

  /* ---------- Google Campus ---------- */
  case 'campus':{
    const gc=[0x4285F4,0xDB4437,0xF4B400,0x0F9D58];
    for(let i=0;i<4;i++){
      const bw=4+Math.random()*2,bd=3+Math.random()*2,bh=3+Math.random()*1.5;
      const bx=(i%2)*7-3.5,bz=Math.floor(i/2)*7-3.5;
      const b=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),M.white);
      b.position.set(bx,bh/2,bz);b.castShadow=true;g.add(b);tag(b);
      const s=new THREE.Mesh(new THREE.BoxGeometry(bw+0.1,0.4,bd+0.1),new THREE.MeshStandardMaterial({color:gc[i]}));
      s.position.set(bx,bh-0.2,bz);g.add(s);
      addWindows(b,bw,bh,bd,2,3,'f');addWindows(b,bw,bh,bd,2,3,'b');
    }
    mainH=4;break;
  }

  /* ---------- Meta Flat Campus ---------- */
  case 'flat':{
    const w=10,d=7,h=4;mainH=h;
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M.white);
    b.position.y=h/2;b.castShadow=true;g.add(b);tag(b);
    g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(w-1,0.3,d-1),new THREE.MeshStandardMaterial({color:0x3a7a3a})),{position:new THREE.Vector3(0,h+0.15,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(w+0.1,0.5,d+0.1),accent),{position:new THREE.Vector3(0,0.25,0)}));
    // Thumbs up
    const tp=new THREE.Mesh(new THREE.BoxGeometry(0.3,1.5,0.3),accent);tp.position.set(w/2+1.5,0.75,0);g.add(tp);
    const tt=new THREE.Mesh(new THREE.SphereGeometry(0.5,6,6),accent);tt.position.set(w/2+1.5,1.8,0);g.add(tt);
    addWindows(b,w,h,d,2,6,'f');addWindows(b,w,h,d,2,6,'b');
    break;
  }

  /* ---------- Amazon Spheres ---------- */
  case 'spheres':{
    [[-2,2.5],[1.5,2],[3.5,1.8]].forEach(([sx,sr])=>{
      const s=new THREE.Mesh(new THREE.IcosahedronGeometry(sr,2),M.glass);
      s.position.set(sx,sr,0);s.castShadow=true;g.add(s);tag(s);
    });
    const wh=new THREE.Mesh(new THREE.BoxGeometry(8,5,5),M.white);
    wh.position.set(0,2.5,-5);wh.castShadow=true;g.add(wh);tag(wh);

function addRoad(x1,z1,x2,z2,width=2.5){
  const dx=x2-x1,dz=z2-z1,len=Math.sqrt(dx*dx+dz*dz),angle=Math.atan2(dx,dz);
  const my=Math.max(Math.max(getTerrainHeight(x1,z1),getTerrainHeight(x2,z2))+0.05,0.05);
  const road=new THREE.Mesh(new THREE.BoxGeometry(width,0.08,len),M.road);
  road.position.set((x1+x2)/2,my,(z1+z2)/2);road.rotation.y=angle;road.receiveShadow=true;scene.add(road);
  const line=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.01,len-1),new THREE.MeshStandardMaterial({color:0xffdd44,roughness:0.5}));
  line.position.set((x1+x2)/2,my+0.05,(z1+z2)/2);line.rotation.y=angle;scene.add(line);
}

const TREE_N=400;
const trunkGeo=new THREE.CylinderGeometry(0.08,0.12,1,5);
const leafGeo=new THREE.SphereGeometry(0.6,6,6);
const coneGeo=new THREE.ConeGeometry(0.5,1.5,6);
const trunkMat=new THREE.MeshStandardMaterial({color:0x6b4226,roughness:0.9});
const leafMat=new THREE.MeshStandardMaterial({color:0x2d8a2d,roughness:0.8});
const darkLeafMat=new THREE.MeshStandardMaterial({color:0x1a5c1a,roughness:0.8});

const trunkInst=new THREE.InstancedMesh(trunkGeo,trunkMat,TREE_N);
const leafInst=new THREE.InstancedMesh(leafGeo,leafMat,Math.floor(TREE_N*0.6));
const coneInst=new THREE.InstancedMesh(coneGeo,darkLeafMat,Math.floor(TREE_N*0.4));
trunkInst.castShadow=true;leafInst.castShadow=true;coneInst.castShadow=true;

const dm=new THREE.Object3D();
let di=0,ci=0;
for(let i=0;i<TREE_N;i++){
  const a=Math.random()*Math.PI*2, r=8+Math.random()*90;
  const tx=Math.cos(a)*r, tz=Math.sin(a)*r;
  const dc=Math.sqrt(tx*tx+tz*tz);
  if(dc<12&&(Math.abs(tx)<3||Math.abs(tz)<3))continue;
  const ty=getTerrainHeight(tx,tz);
  const sc=0.8+Math.random()*1.5;
  dm.position.set(tx,ty+sc*0.5,tz);dm.scale.setScalar(sc);dm.updateMatrix();
  trunkInst.setMatrixAt(i,dm.matrix);
  if(Math.random()<0.6&&di<leafInst.count){
    dm.position.y=ty+sc*1.2;dm.scale.set(sc,sc*(0.8+Math.random()*0.4),sc);dm.updateMatrix();
    leafInst.setMatrixAt(di++,dm.matrix);
  } else if(ci<coneInst.count){
    dm.position.y=ty+sc*1.1;dm.scale.set(sc*0.7,sc,sc*0.7);dm.updateMatrix();
    coneInst.setMatrixAt(ci++,dm.matrix);
  }
}
trunkInst.instanceMatrix.needsUpdate=true;
leafInst.count=di;leafInst.instanceMatrix.needsUpdate=true;
coneInst.count=ci;coneInst.instanceMatrix.needsUpdate=true;
scene.add(trunkInst,leafInst,coneInst);

/* ================================================================
   POST-PROCESSING (Tilt-Shift + Color Grade)
   ================================================================ */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

const tiltShiftUniforms={
  tDiffuse:{value:null},
  focusY:{value:0.45},
  blurAmount:{value:0.0025},
  aspect:{value:window.innerWidth/window.innerHeight},
};
const tiltPass=new ShaderPass({
  uniforms:tiltShiftUniforms,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float focusY,blurAmount,aspect;
    varying vec2 vUv;
    void main(){
      float dist=abs(vUv.y-focusY);
      float blur=smoothstep(0.0,0.35,dist)*blurAmount;
      vec4 sum=vec4(0.0);float tw=0.0;
      for(int i=-3;i<=3;i++){
        for(int j=-3;j<=3;j++){
          float w=1.0-length(vec2(float(i),float(j)))/4.24;
          if(w>0.0){sum+=texture2D(tDiffuse,vUv+vec2(float(i),float(j)*aspect)*blur)*w;tw+=w;}
        }
      }
      vec4 center=texture2D(tDiffuse,vUv);
      float t=smoothstep(0.0,0.3,dist);
      gl_FragColor=mix(center,sum/tw,t*0.55);
    }`
});
composer.addPass(tiltPass);

const gradeUniforms={tDiffuse:{value:null},warmth:{value:0.08},vig:{value:0.4}};
composer.addPass(new ShaderPass({
  uniforms:gradeUniforms,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform float warmth,vig;varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      c.r+=warmth;c.b-=warmth*0.5;
      float d=distance(vUv,vec2(0.5));c.rgb*=1.0-d*d*vig;
      float lum=dot(c.rgb,vec3(0.299,0.587,0.114));
      c.rgb=mix(vec3(lum),c.rgb,1.15);
      gl_FragColor=c;
    }`
}));

const dayS={ai:0.3,hi:1.2,si:2.0,sc:0xfff4e0,fc:new THREE.Color(0xc8ddf0),fd:0.004,ex:1.1,
  st:new THREE.Color(0.48,0.67,1),sb:new THREE.Color(0.78,0.87,0.94),w:0.08};
const nightS={ai:0.08,hi:0.15,si:0.1,sc:0x334466,fc:new THREE.Color(0x0a0a1e),fd:0.008,ex:0.7,
  st:new THREE.Color(0.02,0.02,0.08),sb:new THREE.Color(0.05,0.05,0.15),w:-0.02};

function lerpDN(t){
  const L=THREE.MathUtils.lerp;
  ambientLight.intensity=L(dayS.ai,nightS.ai,t);
  hemiLight.intensity=L(dayS.hi,nightS.hi,t);
  sunLight.intensity=L(dayS.si,nightS.si,t);
  sunLight.color.setHex(t<0.5?dayS.sc:nightS.sc);
  scene.fog.color.lerpColors(dayS.fc,nightS.fc,t);
  scene.fog.density=L(dayS.fd,nightS.fd,t);
  renderer.toneMappingExposure=L(dayS.ex,nightS.ex,t);
  const topC=new THREE.Color().lerpColors(dayS.st,nightS.st,t);
  const botC=new THREE.Color().lerpColors(dayS.sb,nightS.sb,t);
  const ca=sky.geometry.attributes.color;
  for(let i=0;i<skyPosAttr.count;i++){
    const y=Math.max(0,skyPosAttr.getY(i)/250);
    const c=new THREE.Color().lerpColors(botC,topC,y);
    ca.setXYZ(i,c.r,c.g,c.b);
  }
  ca.needsUpdate=true;
  moon.visible=t>0.3;
  slHeads.forEach(h=>{h.material.emissiveIntensity=t*1.5});
  // Window glow
  buildingGroup.traverse(ch=>{
    if(ch.isMesh&&ch.material){
      const hex=ch.material.color.getHex();
      if(hex===0x334455||hex===0x222244||hex===0x225588||hex===0x444444){
        ch.material.emissive=ch.material.emissive||new THREE.Color();
        ch.material.emissive.setHex(0xffdd88);
        ch.material.emissiveIntensity=t*0.6;
      }
    }
  });
  gradeUniforms.warmth.value=L(dayS.w,nightS.w,t);
}

/* ================================================================

   ================================================================ */
let walkMode=false;
const ws={x:0,y:2,z:30,yaw:0,pitch:-0.2};
const keys={w:false,a:false,s:false,d:false};
let dragging=false,lastMX=0,lastMY=0;

function enterWalk(){
  walkMode=true;orbitControls.enabled=false;
  ws.x=camera.position.x;ws.z=camera.position.z;
  ws.y=Math.max(getTerrainHeight(ws.x,ws.z),0)+1.6;
  const d=new THREE.Vector3();camera.getWorldDirection(d);
  ws.yaw=Math.atan2(d.x,d.z);ws.pitch=Math.asin(d.y);
  document.getElementById('crosshair').style.display='block';
  document.getElementById('view-mode').textContent='View: Walk (WASD)';
  document.getElementById('btn-walk').classList.add('active');
}
function exitWalk(){
  walkMode=false;orbitControls.enabled=true;
  orbitControls.target.set(ws.x,ws.y-1,ws.z);
  document.getElementById('crosshair').style.display='none';
  document.getElementById('view-mode').textContent='View: Orbit';
  document.getElementById('btn-walk').classList.remove('active');
}

document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=true;if(k==='escape'&&walkMode)exitWalk()});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false});

renderer.domElement.addEventListener('mousedown',e=>{if(walkMode){dragging=true;lastMX=e.clientX;lastMY=e.clientY}});
renderer.domElement.addEventListener('mousemove',e=>{
  if(walkMode&&dragging){
    ws.yaw-=(e.clientX-lastMX)*0.003;ws.pitch=Math.max(-1.2,Math.min(1.2,ws.pitch-(e.clientY-lastMY)*0.003));
    lastMX=e.clientX;lastMY=e.clientY;
  }
});
document.addEventListener('mouseup',()=>{dragging=false});

renderer.domElement.addEventListener('touchstart',e=>{if(walkMode&&e.touches.length===1){dragging=true;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY}});
renderer.domElement.addEventListener('touchmove',e=>{
  if(walkMode&&dragging&&e.touches.length===1){
    ws.yaw-=(e.touches[0].clientX-lastMX)*0.003;
    ws.pitch=Math.max(-1.2,Math.min(1.2,ws.pitch-(e.touches[0].clientY-lastMY)*0.003));
    lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;
  }
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>{dragging=false});

function updateWalk(dt){
  if(!walkMode)return;
  const spd=12*dt;
  const fwd=new THREE.Vector3(Math.sin(ws.yaw),0,Math.cos(ws.yaw));
  const rht=new THREE.Vector3(Math.cos(ws.yaw),0,-Math.sin(ws.yaw));
  if(keys.w){ws.x+=fwd.x*spd;ws.z+=fwd.z*spd}
  if(keys.s){ws.x-=fwd.x*spd;ws.z-=fwd.z*spd}
  if(keys.a){ws.x-=rht.x*spd;ws.z-=rht.z*spd}
  if(keys.d){ws.x+=rht.x*spd;ws.z+=rht.z*spd}
  ws.x=Math.max(-95,Math.min(95,ws.x));ws.z=Math.max(-95,Math.min(95,ws.z));
  ws.y=Math.max(getTerrainHeight(ws.x,ws.z),0)+1.6;
  camera.position.set(ws.x,ws.y,ws.z);
  camera.lookAt(ws.x+Math.sin(ws.yaw)*Math.cos(ws.pitch),ws.y+Math.sin(ws.pitch),ws.z+Math.cos(ws.yaw)*Math.cos(ws.pitch));
}

const mmCanvas=document.getElementById('minimap-canvas');
const mctx=mmCanvas.getContext('2d');
function drawMinimap(){
  const w=mmCanvas.width,h=mmCanvas.height;
  mctx.fillStyle='#1a2a1a';mctx.fillRect(0,0,w,h);
  mctx.fillStyle='#2a5a2a';mctx.fillRect(10,10,w-20,h-20);
  mctx.strokeStyle='#555';mctx.lineWidth=1;
  mctx.beginPath();mctx.moveTo(w/2,10);mctx.lineTo(w/2,h-10);mctx.stroke();
  mctx.beginPath();mctx.moveTo(10,h/2);mctx.lineTo(w-10,h/2);mctx.stroke();
  companies.forEach(co=>{
    mctx.fillStyle='#'+new THREE.Color(co.color).getHexString();
    const mx=w/2+co.x/100*(w/2-10),mz=h/2+co.z/100*(h/2-10);
    mctx.fillRect(mx-2,mz-2,4,4);
  });
  const cx=w/2+camera.position.x/100*(w/2-10),cz=w/2+camera.position.z/100*(h/2-10);
  mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(cx,cz,3,0,Math.PI*2);mctx.fill();
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  mctx.strokeStyle='#fff';mctx.lineWidth=1;mctx.beginPath();mctx.moveTo(cx,cz);mctx.lineTo(cx+dir.x*15,cz+dir.z*15);mctx.stroke();
}

/* ================================================================
   ANIMATION LOOP
   ================================================================ */
const clock=new THREE.Clock();
let fc=0,ft=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  fc++;ft+=dt;
  if(ft>=0.5){document.getElementById('fps-counter').textContent=`FPS: ${Math.round(fc/ft)}`;fc=0;ft=0}

  // Day/night lerp
  const tgt=isNight?1:0;
  dayNightT+=(tgt-dayNightT)*dt*2;
  if(Math.abs(dayNightT-tgt)>0.001)lerpDN(dayNightT);

  // Cars
  for(let i=0;i<CAR_N;i++){
    const c=carData[i];
    if(c.axis==='x'){c.x+=c.spd*dt;if(c.x>50)c.x=-50;else if(c.x<-50)c.x=50}
    else{c.z+=c.spd*dt;if(c.z>50)c.z=-50;else if(c.z<-50)c.z=50}
    c.y=Math.max(getTerrainHeight(c.x,c.z),0)+0.15;
    dm.position.set(c.x,c.y,c.z);dm.rotation.set(0,c.ang,0);dm.scale.setScalar(1);dm.updateMatrix();
    carInst.setMatrixAt(i,dm.matrix);
  }
  carInst.instanceMatrix.needsUpdate=true;

  // People
  for(let i=0;i<PPL_N;i++){
    const p=pplData[i];
    p.x+=Math.sin(p.dir)*p.spd*dt;p.z+=Math.cos(p.dir)*p.spd*dt;
    if(Math.random()<0.01)p.dir+=Math.random()*0.5-0.25;
    if(Math.abs(p.x)>45||Math.abs(p.z)>45)p.dir+=Math.PI;
    p.y=Math.max(getTerrainHeight(p.x,p.z),0)+0.15;
    dm.position.set(p.x,p.y,p.z);dm.scale.setScalar(1);dm.updateMatrix();
    pplInst.setMatrixAt(i,dm.matrix);
  }
  pplInst.instanceMatrix.needsUpdate=true;

  updateWalk(dt);
  if(!walkMode)orbitControls.update();

  tiltShiftUniforms.focusY.value=walkMode?0.5:0.45;
  tiltShiftUniforms.blurAmount.value=walkMode?0.0008:0.0025;

  composer.render();
  if(fc%15===0)drawMinimap();
}
animate();
drawMinimap();
</script>
