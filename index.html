/* ---------- Sky Dome ---------- */
function makeSky(){
  const geo = new THREE.SphereGeometry(300, 24, 16);
  const colors = [];
  const posAttr = geo.attributes.position;
  const topColor = new THREE.Color(0x1e6fd9);
  const botColor = new THREE.Color(0xbfe3ff);
  for(let i=0;i<posAttr.count;i++){
    const y = posAttr.getY(i);
    const t = THREE.MathUtils.clamp((y + 300) / 600, 0, 1);
    const c = botColor.clone().lerp(topColor, t);
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const mat = new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false });
  const mesh = new THREE.Mesh(geo, mat);
  return mesh;
}
const sky = makeSky();
scene.add(sky);

/* Stars for night */
const starGeo = new THREE.BufferGeometry();
const starCount = 500;
const starPos = new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const r = 290;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.random()*Math.PI*0.5; // upper hemisphere mostly
  starPos[i*3] = r*Math.sin(phi)*Math.cos(theta);
  starPos[i*3+1] = r*Math.cos(phi)*0.9 + 20;
  starPos[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:1.4, transparent:true, opacity:0 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

/* ---------- Roads (merged geometry) ---------- */
function buildRoads(){
  const roadGeos = [];
  const lineGeos = [];
  const roadY = 0.02, lineY = 0.03;
  const roadSpecs = [
    // [x, z, w, d]  centered rectangles forming a grid
    [0, 0, 8, GROUND_SIZE],     // vertical main
    [0, 0, GROUND_SIZE, 8],     // horizontal main
    [-40, 0, 6, GROUND_SIZE*0.9],
    [40, 0, 6, GROUND_SIZE*0.9],
    [0, -40, GROUND_SIZE*0.9, 6],
    [0, 40, GROUND_SIZE*0.9, 6],
    [75, -75, 60, 6],
    [75, -75, 6, 60],
  ];
  roadSpecs.forEach(([x,z,w,d])=>{
    const g = new THREE.BoxGeometry(w, 0.05, d);
    g.translate(x, roadY, z);
    roadGeos.push(g);
  });
  const merged = BufferGeometryUtils.mergeGeometries(roadGeos);
  const roadMat = new THREE.MeshStandardMaterial({ color:0x424242, roughness:0.95 });
  const roadMesh = new THREE.Mesh(merged, roadMat);
  scene.add(roadMesh);

  // Yellow center lines - dashed segments along main axes
  const lineMat = new THREE.MeshStandardMaterial({ color:0xFFD54F, emissive:0x554400, roughness:0.8 });
  for(let i=-95;i<95;i+=6){
    const g1 = new THREE.BoxGeometry(0.4, 0.02, 3);
    g1.translate(0, lineY, i);
    lineGeos.push(g1);
    const g2 = new THREE.BoxGeometry(3, 0.02, 0.4);
    g2.translate(i, lineY, 0);
    lineGeos.push(g2);
  }
  const mergedLines = BufferGeometryUtils.mergeGeometries(lineGeos);
  const lineMesh = new THREE.Mesh(mergedLines, lineMat);
  scene.add(lineMesh);

  return roadMesh;
}
buildRoads();

function isNearBuilding(x,z, margin=6){
  for(const c of COMPANIES){
    const dx = x-c.pos[0], dz = z-c.pos[1];
    if(Math.sqrt(dx*dx+dz*dz) < margin) return true;
  }
  for(const g of GRAVEYARD){
    const dx = x-g.pos[0], dz = z-g.pos[1];
    if(Math.sqrt(dx*dx+dz*dz) < margin) return true;
  }
  return false;
}
function isOnRoad(x,z){
  if(Math.abs(x) < 5) return true;
  if(Math.abs(z) < 5) return true;
  if(Math.abs(x-40) < 4 || Math.abs(x+40) < 4) return true;
  if(Math.abs(z-40) < 4 || Math.abs(z+40) < 4) return true;
  return false;
}

function makeWindowStrip(width, height, count, color){
  // returns a group of small emissive planes representing windows
  const group = new THREE.Group();
  const winMat = new THREE.MeshStandardMaterial({ color:0x222222, emissive:0xffcc66, emissiveIntensity:0.0, roughness:0.5 });
  const rows = Math.max(1, Math.floor(height/1.4));
  const cols = Math.max(1, Math.floor(width/1.0));
  const wGeo = new THREE.PlaneGeometry(0.35, 0.5);
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(Math.random() < 0.25) continue;
      const m = new THREE.Mesh(wGeo, winMat.clone());
      m.position.set(-width/2 + 0.6 + c*(width/cols), -height/2 + 0.8 + r*1.3, 0);
      group.add(m);
    }
  }
  return group;
}

function attachWindowsToBox(mesh, w, h, d){
  const windows = [];
  const front = makeWindowStrip(w, h, 1, 0xffcc66);
  front.position.z = d/2 + 0.02;
  mesh.add(front); windows.push(front);
  const back = makeWindowStrip(w, h, 1, 0xffcc66);
  back.position.z = -d/2 - 0.02; back.rotation.y = Math.PI;
  mesh.add(back); windows.push(back);
  return windows;
}

function standardMat(color){
  return new THREE.MeshStandardMaterial({ color, roughness:0.6, metalness:0.1 });
}

function baseAOPatch(w,d){
  const geo = new THREE.CircleGeometry(Math.max(w,d)*0.75, 16);
  geo.rotateX(-Math.PI/2);
  const mat = new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.18 });
  const m = new THREE.Mesh(geo, mat);
  m.position.y = 0.03;
  return m;
}

function buildTower(company){
  const group = new THREE.Group();

  group.add(baseAOPatch(w+2,d+2));

  const bodyGeo = new THREE.BoxGeometry(w, 1, d);

/* ---------- Scaffolding (for under-construction) ---------- */
function buildScaffold(w,d,maxH){
  const group = new THREE.Group();
  const poleMat = new THREE.MeshStandardMaterial({ color:0xffb300, roughness:0.7 });
  const poleGeo = new THREE.CylinderGeometry(0.04,0.04,maxH,5);
  const corners = [[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2]];
  corners.forEach(c=>{
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.set(c[0], maxH/2, c[1]);
    group.add(pole);
  });
  // horizontal braces every ~2 units
  for(let y=0.5;y<maxH;y+=2){
    const braceGeo = new THREE.BoxGeometry(w+0.2,0.05,0.05);
    const b1 = new THREE.Mesh(braceGeo, poleMat); b1.position.set(0,y,-d/2);
    const b2 = b1.clone(); b2.position.z = d/2;
    const braceGeoD = new THREE.BoxGeometry(0.05,0.05,d+0.2);
    const b3 = new THREE.Mesh(braceGeoD, poleMat); b3.position.set(-w/2,y,0);
    const b4 = b3.clone(); b4.position.x = w/2;
    group.add(b1,b2,b3,b4);
  }
  // mini crane on top
  const craneG = new THREE.Group();
  const craneMat = new THREE.MeshStandardMaterial({ color:0xff6f00, roughness:0.6 });
  const craneTower = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.5,5), craneMat);
  const craneArm = new THREE.Mesh(new THREE.BoxGeometry(2,0.06,0.06), craneMat);
  craneArm.position.set(0.9,0.75,0);
  craneG.add(craneTower, craneArm);
  craneG.position.y = maxH;
  group.add(craneG);
  return group;
}

function buildTombstone(w,d){
  const group = new THREE.Group();
  const rubbleMat = new THREE.MeshStandardMaterial({ color:0x757575, roughness:1.0 });
  for(let i=0;i<8;i++){
    const size = 0.3 + Math.random()*0.5;
    const rock = new THREE.Mesh(new THREE.BoxGeometry(size,size*0.6,size), rubbleMat);
    rock.position.set((Math.random()-0.5)*w, size*0.3, (Math.random()-0.5)*d);
    rock.rotation.set(Math.random(),Math.random(),Math.random());
    group.add(rock);
  }
  const stoneMat = new THREE.MeshStandardMaterial({ color:0x616161, roughness:0.85 });
  const stone = new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.2), stoneMat);
  stone.position.set(0,0.6,-d/2-1);
  group.add(stone);
  return group;
}

/* ============================================================
   TIME CONTROL / STATE
   ============================================================ */
let currentYear = YEAR_MIN;
let isPlaying = false;
let playTimer = null;

function valuationAt(company, year){
  const years = Object.keys(company.val).map(Number).sort((a,b)=>a-b);
  if(year <= years[0]) return company.val[years[0]];
  if(year >= years[years.length-1]) return company.val[years[years.length-1]];
  // find bounds
  let lo = years[0], hi = years[years.length-1];
  for(let i=0;i<years.length-1;i++){
    if(year >= years[i] && year <= years[i+1]){ lo = years[i]; hi = years[i+1]; break; }
  }
  const t = (year - lo) / (hi - lo || 1);
  return company.val[lo] + (company.val[hi]-company.val[lo]) * t;
}

function updateYearState(year){
  COMPANIES.forEach(company=>{
    const bg = buildingGroups[company.id];
    const appears = company.appears || YEAR_MIN;
    const notYetAppeared = year < appears;
    const constructionWindow = (year >= appears && year < appears + 1);
    bg.currentlyUnderConstruction = constructionWindow && !notYetAppeared;

    if(notYetAppeared){
      bg.targetHeight = 0;
      bg.group.visible = false;
    } else {
      bg.group.visible = true;
      const val = valuationAt(company, Math.max(year, appears));
      bg.targetHeight = heightForValuation(val);
    }

    // Rebrand handling
    let displayName = company.name;
    let displayColor = company.color;
    if(company.altName && year >= company.altYear){
      displayName = company.altName;
      if(company.altColor !== undefined) displayColor = company.altColor;
    }
    bg.labelName = displayName;
    if(bg.built.mat && bg.built.mat.color) {
      const target = new THREE.Color(displayColor);
      if(!bg.built.mat.color.equals(target)){
        bg.built._colorLerpTarget = target;
      }
    }
    // twitter bird/x swap
    if(company.id === 'twitter'){
      const isX = year >= company.altYear;
      bg.built.bird.visible = !isX;
      bg.built.xGroup.visible = isX;
    }

    bg.scaffold.visible = bg.currentlyUnderConstruction;
  });
}

updateYearState(currentYear);
// snap heights instantly on first load
Object.values(buildingGroups).forEach(bg=>{
  if(bg.company){ bg.currentHeight = bg.targetHeight; }
});

function setYear(year){

  currentYear = year;
  document.getElementById('yearLabel').textContent = year;

  updateYearState(year);
}

/* ============================================================
   DAY / NIGHT TOGGLE
   ============================================================ */
let isNight = false;
let dnTransitionT = 0; // 0 = day, 1 = night
const dnToggle = document.getElementById('dnToggle');
const dayColors = {
  hemiSky: new THREE.Color(0xbfe3ff), hemiGround: new THREE.Color(0x4CAF50),
  sun: new THREE.Color(0xfff8e7), sunIntensity: 2.0, hemiIntensity: 1.4, ambIntensity: 0.6,
  skyTop: new THREE.Color(0x1e6fd9), skyBot: new THREE.Color(0xbfe3ff),
};
const nightColors = {
  hemiSky: new THREE.Color(0x0a1a33), hemiGround: new THREE.Color(0x0d2a12),
  sun: new THREE.Color(0x88aaff), sunIntensity: 0.25, hemiIntensity: 0.3, ambIntensity: 0.12,
  skyTop: new THREE.Color(0x02040f), skyBot: new THREE.Color(0x0a1a33),
};
dnToggle.addEventListener('click', ()=>{
  isNight = !isNight;
  dnToggle.textContent = isNight ? '\u{1F319}' : '☀️';
});

function updateDayNight(dt){
  const target = isNight ? 1 : 0;
  dnTransitionT += (target - dnTransitionT) * Math.min(dt*1.0, 1) ;
  const t = dnTransitionT;
  hemiLight.color.copy(dayColors.hemiSky).lerp(nightColors.hemiSky, t);
  hemiLight.groundColor = hemiLight.groundColor || new THREE.Color();
  hemiLight.groundColor.copy(dayColors.hemiGround).lerp(nightColors.hemiGround, t);
  hemiLight.intensity = THREE.MathUtils.lerp(dayColors.hemiIntensity, nightColors.hemiIntensity, t);
  sunLight.color.copy(dayColors.sun).lerp(nightColors.sun, t);
  sunLight.intensity = THREE.MathUtils.lerp(dayColors.sunIntensity, nightColors.sunIntensity, t);
  fillLight.intensity = THREE.MathUtils.lerp(dayColors.ambIntensity, nightColors.ambIntensity, t);

  // sky vertex colors — only update when transitioning
  if(Math.abs(target - t) > 0.001){
    const posAttr = sky.geometry.attributes.position;
    const colorAttr = sky.geometry.attributes.color;
    for(let i=0;i<posAttr.count;i++){
      const y = posAttr.getY(i);
      const f = THREE.MathUtils.clamp((y+300)/600,0,1);
      const cDay = dayColors.skyBot.clone().lerp(dayColors.skyTop, f);
      const cNight = nightColors.skyBot.clone().lerp(nightColors.skyTop, f);
      const c = cDay.lerp(cNight, t);
      colorAttr.setXYZ(i, c.r, c.g, c.b);
    }
    colorAttr.needsUpdate = true;

    starMat.opacity = t * 0.9;

    Object.values(buildingGroups).forEach(bg=>{
      if(!bg.built || !bg.built.windows) return;
      bg.built.windows.forEach(strip=>{
        strip.children.forEach(w=>{
          w.material.emissiveIntensity = t * 1.4;
        });
      });
    });
  }
}

    case 'ShiftLeft': case 'ShiftRight': move.sprint = false; break;

const collisionRaycaster = new THREE.Raycaster();
function collidesAhead(dir, distance){
  const origin = yawObject.position.clone();
  origin.y = 1.2;
  collisionRaycaster.set(origin, dir);
  collisionRaycaster.far = distance;
  const hits = collisionRaycaster.intersectObjects(raycastTargets, false);
  return hits.length > 0 && hits[0].distance < distance;
}

function updateMovement(dt){
  if(!isActive){ velocity.set(0,0,0); return; }
  const maxSpeed = move.sprint ? SPRINT_SPEED : MAX_SPEED;

  const wantX = (move.right?1:0) - (move.left?1:0);
  const wantZ = (move.back?1:0) - (move.forward?1:0);
  const wantLen = Math.hypot(wantX, wantZ);

  if(wantLen > 0){
    velocity.x += (wantX/wantLen) * ACCEL * dt;
    velocity.z += (wantZ/wantLen) * ACCEL * dt;
  }
  const speed = Math.hypot(velocity.x, velocity.z);
  if(speed > 0){
    const damp = Math.max(0, speed - DECEL*dt) / speed;
    velocity.x *= (wantLen>0 ? 1 : damp);
    velocity.z *= (wantLen>0 ? 1 : damp);
  }
  const curSpeed = Math.hypot(velocity.x, velocity.z);
  if(curSpeed > maxSpeed){
    velocity.x = velocity.x/curSpeed * maxSpeed;
    velocity.z = velocity.z/curSpeed * maxSpeed;
  }
  if(curSpeed < 0.01){ velocity.x = 0; velocity.z = 0; }

  const forward = new THREE.Vector3(0,0,-1);
  forward.applyQuaternion(yawObject.quaternion);
  forward.y = 0; forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

  const moveDir = new THREE.Vector3();
  moveDir.addScaledVector(forward, -velocity.z*dt);
  moveDir.addScaledVector(right, velocity.x*dt);

  const distance = moveDir.length();
  if(distance > 0.0001){
    const dirNorm = moveDir.clone().normalize();
    if(!collidesAhead(dirNorm, distance + 0.6)){
      yawObject.position.add(moveDir);
    } else {
      const tryX = new THREE.Vector3(moveDir.x,0,0);
      const tryZ = new THREE.Vector3(0,0,moveDir.z);
      if(tryX.length()>0.0001 && !collidesAhead(tryX.clone().normalize(), tryX.length()+0.6)) yawObject.position.add(tryX);
      if(tryZ.length()>0.0001 && !collidesAhead(tryZ.clone().normalize(), tryZ.length()+0.6)) yawObject.position.add(tryZ);
    }
  }

  const p = yawObject.position;
  const bound = GROUND_SIZE/2 - 2;
  p.x = THREE.MathUtils.clamp(p.x, -bound, bound);
  p.z = THREE.MathUtils.clamp(p.z, -bound, bound);
  p.y = 1.6;
}

   MINIMAP
   ============================================================ */
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');
function drawMinimap(){
  const size = miniCanvas.width;
  miniCtx.clearRect(0,0,size,size);
  miniCtx.fillStyle = 'rgba(76,175,80,0.35)';
  miniCtx.fillRect(0,0,size,size);
  const scale = size / GROUND_SIZE;
  const toMini = (x,z) => [ size/2 + x*scale, size/2 + z*scale ];

  // buildings
  COMPANIES.forEach(c=>{
    const bg = buildingGroups[c.id];
    if(!bg.group.visible) return;
    const [mx,mz] = toMini(c.pos[0], c.pos[1]);
    miniCtx.fillStyle = '#' + c.color.toString(16).padStart(6,'0');
    miniCtx.beginPath();
    miniCtx.arc(mx, mz, 3, 0, Math.PI*2);
    miniCtx.fill();
  });
  // graveyard
  GRAVEYARD.forEach(g=>{
    const [mx,mz] = toMini(g.pos[0], g.pos[1]);
    miniCtx.fillStyle = '#9e9e9e';
    miniCtx.beginPath();
    miniCtx.arc(mx, mz, 2.5, 0, Math.PI*2);
    miniCtx.fill();
  });

  // player
  const p = yawObject.position;
  const [px,pz] = toMini(p.x, p.z);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const angle = Math.atan2(dir.x, dir.z);
  miniCtx.save();
  miniCtx.translate(px,pz);
  miniCtx.rotate(angle);
  miniCtx.fillStyle = '#3b82f6';
  miniCtx.beginPath();
  miniCtx.moveTo(0,-6);
  miniCtx.lineTo(4,5);
  miniCtx.lineTo(-4,5);
  miniCtx.closePath();
  miniCtx.fill();
  miniCtx.restore();
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = new THREE.Clock();
let fpsAccum = 0, fpsFrames = 0, fpsTimer = 0;
const fpsLine = document.getElementById('fpsLine');

const dummyObj = new THREE.Object3D();

function updateBuildings(dt){
  Object.values(buildingGroups).forEach(bg=>{
    if(!bg.company) return;
    const built = bg.built;
    // smooth height lerp
    bg.currentHeight += (bg.targetHeight - bg.currentHeight) * Math.min(dt*2.2, 1);
    const h = Math.max(bg.currentHeight, 0.05);

    if(built.bodies){ // campus
      built.bodies.forEach((body,i)=>{
        const localH = h * (0.85 + i*0.05);
        body.scale.y = Math.max(localH, 0.1);
        body.position.y = localH/2;
      });
    } else if(built.body){
      if(bg.company.shape === 'ring'){
        // ring building doesn't scale height like a tower; scale slightly with valuation for feel
        const s = 0.6 + Math.min(h/12, 1) * 0.6;
        built.body.scale.set(s,1,s);
      } else {
        built.body.scale.y = h;
        built.body.position.y = h/2;
        if(built.roof){
          built.roof.position.y = h + (built.roof.geometry && built.roof.geometry.type==='SphereGeometry' ? 0 : 0.15);
        }
      }
    }

    // color lerp for rebrands
    if(built._colorLerpTarget && built.mat && built.mat.color){
      built.mat.color.lerp(built._colorLerpTarget, Math.min(dt*1.5,1));
    }

    // death / graveyard visual state (dead if targetHeight ~ 0 after having appeared, only for grayed ones - not used broadly since none of the 22 die in this dataset, but supports Twitter going private etc via alt states)
  });

  // Scaffold cranes gentle sway (arm rotation) for under-construction buildings
  Object.values(buildingGroups).forEach(bg=>{
    if(bg.scaffold && bg.scaffold.visible){
      bg.scaffold.rotation.y = Math.sin(clock.elapsedTime*0.3) * 0.05;
    }
  });
}

function updateCars(dt){
  const dummy = dummyObj;
  carData.forEach((c, i)=>{
    c.offset += c.speed * c.dir * dt;
    if(c.offset > 100) c.offset = -100;
    if(c.offset < -100) c.offset = 100;
    let x,z,rotY;
    if(c.axis === 'x'){
      x = c.offset; z = c.lane + (c.dir>0?1.2:-1.2);
      rotY = c.dir>0 ? Math.PI/2 : -Math.PI/2;
    } else {
      z = c.offset; x = c.lane + (c.dir>0?-1.2:1.2);
      rotY = c.dir>0 ? 0 : Math.PI;
    }
    dummy.position.set(x, 0.35, z);
    dummy.rotation.set(0, rotY, 0);
    dummy.updateMatrix();
    carMesh.setMatrixAt(i, dummy.matrix);
  });
  carMesh.instanceMatrix.needsUpdate = true;
}

function updateDrones(dt){
  droneData.forEach(d=>{
    d.phase += d.speed*dt;
    const x = d.center[0] + Math.cos(d.phase)*d.radius*0.3 + Math.sin(d.phase*0.6)*4;
    const z = d.center[1] + Math.sin(d.phase)*d.radius*0.3;
    d.mesh.position.set(x, d.height + Math.sin(d.phase*2)*0.5, z);
    d.mesh.rotation.y += dt*2;
  });
}

function updateCranes(dt){
  craneData.forEach(c=>{
    c.pivot.rotation.y += c.speed*dt;
  });
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  updateMovement(dt);
  updateBuildings(dt);
  updateCars(dt);
  updateDrones(dt);
  updateCranes(dt);
  updateDayNight(dt);

  // hover highlight
  const hit = isActive ? findHoverTarget() : null;
  if(hit !== hoveredMesh){
    clearHoverHighlight();
    hoveredMesh = hit;
    if(hoveredMesh && hoveredMesh.material && hoveredMesh.material.emissive !== undefined){
      hoveredMesh.userData._baseEmissive = hoveredMesh.material.emissiveIntensity || 0;
      hoveredMesh.material.emissive = hoveredMesh.material.emissive || new THREE.Color(0xffffff);
      hoveredMesh.material.emissiveIntensity = Math.max(hoveredMesh.userData._baseEmissive, 0.25);
    }
  }

  drawMinimap();

  composer.render();

  fpsAccum += dt; fpsFrames++;
  fpsTimer += dt;
  if(fpsTimer > 0.5){
    const fps = Math.round(fpsFrames/fpsAccum);
    fpsLine.textContent = 'FPS: ' + fps;
    fpsAccum = 0; fpsFrames = 0; fpsTimer = 0;
  }
}

animate();
</script>
